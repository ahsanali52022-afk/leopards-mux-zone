<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leopards MUX Zone Room</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #1e293b;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { font-size: 18px; }
  #roomStatus { font-size: 13px; color: #94a3b8; }
  #roomStatus b { color: #4ade80; }

  main { flex: 1; display: flex; flex-wrap: wrap; padding: 12px; gap: 12px; }

  .left { flex: 1 1 320px; min-width: 280px; display: flex; flex-direction: column; gap: 12px; }
  .right { flex: 1 1 380px; min-width: 300px; display: flex; flex-direction: column; gap: 12px; }

  .panel {
    background: #1e293b;
    border-radius: 12px;
    padding: 14px;
  }
  .panel h2 { font-size: 14px; margin-bottom: 10px; color: #93c5fd; }

  .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .controls button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    background: #334155;
    color: #e2e8f0;
    transition: all .15s;
  }
  .controls button:hover { background: #475569; }
  .controls button.off { background: #dc2626; }
  .controls button.raise { background: #fbbf24; color: #000; font-weight: 700; }

  #notes {
    width: 100%;
    height: 140px;
    background: #0f172a;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    resize: vertical;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  .chat-log {
    height: 220px;
    overflow-y: auto;
    background: #0f172a;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 14px;
  }
  .chat-log .msg { background: #1e293b; padding: 6px 10px; border-radius: 8px; }
  .chat-log .msg b { color: #93c5fd; }
  .chat-log .sys { color: #64748b; font-size: 12px; text-align: center; }
  .chat-input { display: flex; gap: 8px; margin-top: 8px; }
  .chat-input input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
  }
  .chat-input button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #4ade80;
    color: #000;
    font-weight: 700;
    cursor: pointer;
  }

  .members { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
  .member {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #0f172a;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
  }
  .member .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; }
  .member.muted .dot { background: #dc2626; }
  .member.raised { border: 1px solid #fbbf24; }
  .member .muted-icon, .member .hand-icon { font-size: 13px; margin-left: auto; }
  .member .admin-mute {
    margin-left: 6px; padding: 3px 8px; border: none; border-radius: 6px;
    background: #dc2626; color: #fff; font-size: 12px; cursor: pointer;
  }
  .member .admin-mute:hover { background: #ef4444; }
  .member.admin { border: 1px solid #fbbf24; }

  .screen-area { display: none; flex-direction: column; gap: 8px; }
  .screen-area.active { display: flex; }
  .screen-tile { position: relative; background: #0f172a; border-radius: 10px; overflow: hidden; border: 2px solid #4ade80; }
  .screen-tile video { width: 100%; max-height: 300px; object-fit: contain; display: block; background: #000; }
  .screen-tile .label {
    position: absolute; bottom: 4px; left: 6px;
    background: rgba(0,0,0,0.7); padding: 2px 10px; border-radius: 6px; font-size: 12px;
  }

  .join-screen {
    position: fixed; inset: 0;
    background: #0f172a;
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  .join-box {
    background: #1e293b; padding: 30px; border-radius: 14px;
    width: 90%; max-width: 380px; text-align: center;
  }
  .join-box h2 { margin-bottom: 8px; }
  .join-box p { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
  .join-box input {
    width: 100%; padding: 12px; margin-bottom: 10px;
    border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: #e2e8f0; font-size: 15px;
  }
  .join-box button {
    width: 100%; padding: 13px; border: none; border-radius: 8px;
    background: #4ade80; color: #000; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .join-box .hint { margin-top: 12px; font-size: 12px; color: #64748b; }
  .schedule-box {
    background: #0f172a; border-radius: 8px; padding: 10px; margin-bottom: 10px; text-align: left;
  }
  .schedule-box h3 { font-size: 13px; color: #93c5fd; margin-bottom: 8px; text-align: center; }
  .schedule-box input {
    width: 48%; display: inline-block; padding: 9px; margin-bottom: 8px;
    border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #e2e8f0; font-size: 13px;
  }
  .schedule-box .sched-btn {
    width: 100%; background: #fbbf24; color: #000; padding: 11px; margin-bottom: 6px;
  }
  .schedule-box .sched-btn:last-of-type { margin-bottom: 0; }
  #schedLink {
    margin-top: 8px; padding: 9px; background: #1e293b; border-radius: 8px;
    font-size: 12px; color: #94a3b8; word-break: break-all; display: none;
  }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #334155; color: #e2e8f0; padding: 10px 18px; border-radius: 8px;
    font-size: 14px; display: none; z-index: 60; max-width: 90%;
  }
</style>
</head>
<body>

<div class="join-screen" id="joinScreen">
  <div class="join-box">
    <h2>🐆 Leopards MUX Zone Room</h2>
    <p>50 log tak. Name + Room ID se join karein.</p>
    <input id="joinName" type="text" placeholder="Your name" maxlength="30" onkeydown="if(event.key==='Enter')startMeeting()">
    <input id="joinRoom" type="text" placeholder="Room ID (e.g. logistics-1)" maxlength="40">
    <div class="schedule-box">
      <h3>📅 Meeting Schedule</h3>
      <input id="schedDate" type="date">
      <input id="schedTime" type="time">
      <button class="sched-btn" onclick="scheduleMeeting()">📅 Schedule & Share</button>
      <button class="sched-btn" style="background:#4ade80;" onclick="copyRoomLink()">🔗 Copy Room Link</button>
      <div id="schedLink"></div>
    </div>
    <button onclick="startMeeting()">Join Meeting</button>
    <p class="hint">Same Room ID par sab join karein. Mic permission allow karein.</p>
  </div>
</div>

<header>
  <h1>🐆 Leopards MUX Zone Room</h1>
  <div id="roomStatus">Joining...</div>
</header>

<main>
  <div class="left">
    <div class="panel">
      <h2>🎛 Controls</h2>
      <div class="controls">
        <button id="btnMic" onclick="toggleMic()">🎤 Mic: ON</button>
        <button id="btnHand" class="raise" onclick="toggleHand()">🙋 Raise Hand</button>
        <button id="btnScreen" onclick="toggleScreen()">🖥 Screen Share</button>
        <button onclick="copyLink()">🔗 Copy Room Link</button>
      </div>
    </div>

    <div class="panel">
      <h2>👥 Members (<span id="memberCount">1</span>)</h2>
      <div class="members" id="members"></div>
    </div>
  </div>

  <div class="right">
    <div class="panel screen-area" id="screenArea">
      <h2>🖥 Shared Screens</h2>
      <div id="screenTiles"></div>
    </div>

    <div class="panel">
      <h2>📝 Shared Notes <span style="color:#4ade80;font-size:11px;" id="notesSaved"></span></h2>
      <textarea id="notes" placeholder="Type notes here..."></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="sched-btn" style="background:#4ade80;color:#000;border:none;border-radius:8px;padding:10px;cursor:pointer;flex:1;" onclick="generateSummary()">🤖 Auto Summary</button>
        <button class="sched-btn" style="background:#fbbf24;color:#000;border:none;border-radius:8px;padding:10px;cursor:pointer;flex:1;" onclick="exportNotes()">⬇️ Export Notes</button>
      </div>
      <div id="summaryBox" style="margin-top:8px;display:none;">
        <div style="font-size:13px;color:#93c5fd;margin-bottom:6px;">📊 Summary:</div>
        <div id="summaryText" style="background:#0f172a;border-radius:8px;padding:10px;font-size:13px;white-space:pre-wrap;"></div>
      </div>
    </div>

    <div class="panel">
      <h2>💬 Chat</h2>
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input">
        <input id="chatMsg" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
  let peer = null;
  let roomId = '';
  let myName = '';
  let myStream = null;
  let myAudioTrack = null;
  let screenStream = null;
  let isMicOn = true;
  let isScreenOn = false;
  let handRaised = false;
  let isAdminMuted = false;

  const connections = {};       // peerId -> data connection
  const audioEls = {};          // peerId -> audio element
  const screenCalls = {};       // peerId -> screen call (sharer side)
  const memberMeta = {};        // peerId -> {name, muted, hand}
  const receivingScreen = {};   // peerId -> bool

  let isAdmin = false;          // room host (admin)
  let originalHostName = '';    // pehle host ka naam (wapis aye to host wapas mile)
  let lastHeartbeat = 0;        // host ka aakhri heartbeat time
  let heartbeatTimer = null;    // heartbeat check timer
  let hostKey = '';             // original host ka secret key (URL me hota hai)
  let amOriginalHost = false;   // kya main original host hoon

  function $(id) { return document.getElementById(id); }
  function toast(msg) {
    $('toast').textContent = msg;
    $('toast').style.display = 'block';
    setTimeout(() => $('toast').style.display = 'none', 4000);
  }
  function addChat(name, text, sys) {
    const log = $('chatLog');
    const div = document.createElement('div');
    if (sys) { div.className = 'sys'; div.textContent = text; }
    else { div.className = 'msg'; div.innerHTML = `<b>${escapeHtml(name)}:</b> ${escapeHtml(text)}`; }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function genKey() {
    return Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }

  // ----- link/share -----
  function buildUrl() {
    const room = $('joinRoom').value.trim() || 'leopards-zone';
    $('joinRoom').value = room;
    return location.href.split('#')[0] + '#room=' + encodeURIComponent(room) + '&host=' + hostKey;
  }

  function scheduleMeeting() {
    const date = $('schedDate').value;
    const time = $('schedTime').value;
    if (!date || !time) { alert('Date aur time zaroori hai.'); return; }
    const url = buildUrl();
    const linkBox = $('schedLink');
    linkBox.style.display = 'block';
    linkBox.textContent = '📅 ' + date + ' ' + time + ' — ' + url;
    navigator.clipboard.writeText(url + '\n📅 Meeting: ' + date + ' ' + time + ' (Leopards MUX Zone Room)')
      .then(() => { toast('Link + schedule copied!'); })
      .catch(() => { toast('Copy failed — link neeche dikha hai'); });
  }

  function copyRoomLink() {
    const url = buildUrl();
    navigator.clipboard.writeText(url + '\nLeopards MUX Zone Room — open karein aur apna naam likh kar join karein')
      .then(() => toast('Room link copied! ' + url))
      .catch(() => toast(url));
  }

  async function startMeeting() {
    const name = $('joinName').value.trim();
    const room = $('joinRoom').value.trim();
    if (!name || !room) { alert('Name aur Room ID zaroori hai.'); return; }
    myName = name; roomId = room;

    try {
      myStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: false
      });
      myAudioTrack = myStream.getAudioTracks()[0] || null;
    } catch (e) {
      myStream = null; myAudioTrack = null;
      toast('Mic nahi mili — text mode mein join ho gaye');
    }
    $('joinScreen').style.display = 'none';
    setupPeer();
  }

  // ----- peer connection setup -----
  function setupPeer() {
    peer = new Peer(roomId);
    peer.on('open', () => {
      // room pehle se nahi tha — main original host hoon
      isAdmin = true;
      amOriginalHost = true;
      originalHostName = myName;
      if (!hostKey) hostKey = genKey();
      localStorage.setItem('lmz-owner-' + roomId, hostKey);
      updateRoomStatus();
      renderMembers();
      loadNotes();
      addChat('', `You created the room (${roomId}) — Aap admin hain 👑`, true);
      startHeartbeat();
    });
    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        // room pehle se hai — member ban kar join karo
        joinAsMember();
      } else if (err.type === 'peer-unavailable') {
        toast('Room host offline ho gaye — naya host ban raha hai...');
        tryBecomeHost();
      } else if (err.type !== 'browser-incompatible') {
        console.warn(err);
      }
    });
    peer.on('connection', (conn) => setupConn(conn));
    peer.on('call', (call) => handleIncomingCall(call));
  }

  // member ban kar join karo
  function joinAsMember() {
    const unique = roomId + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const oldPeer = peer;
    peer = new Peer(unique);
    peer.on('open', () => {
      oldPeer.destroy();
      updateRoomStatus();
      addChat('', `Joined room (${roomId})`, true);
      loadNotes();
      const conn = peer.connect(roomId); // host se connect
      conn.on('open', () => {
        onConnected(conn);
        conn.send({ type: 'hello', name: myName, muted: !isMicOn, hand: handRaised });
        if (amOriginalHost) conn.send({ type: 'request-host', hostKey, name: myName });
      });
      conn.on('data', (d) => handleData(d, conn));
      conn.on('close', () => {
        toast('Host se connection tut gaya — naya host dhoond raha hai...');
        tryBecomeHost();
      });
      startHostWatch();
    });
    peer.on('connection', (conn) => setupConn(conn));
    peer.on('error', (e) => { if (e.type !== 'peer-unavailable') console.warn(e); });
    peer.on('call', (call) => handleIncomingCall(call));
  }

  // host gayab ho to naya host banne ki koshish
  function tryBecomeHost() {
    clearInterval(heartbeatTimer);
    const oldPeer = peer;
    const newPeer = new Peer(roomId);
    newPeer.on('open', () => {
      // main naya host ban gaya
      oldPeer.destroy();
      peer = newPeer;
      isAdmin = true;
      amOriginalHost = false;
      updateRoomStatus();
      renderMembers();
      addChat('', 'Aap naye host ban gaye (admin) 👑', true);
      startHeartbeat();
    });
    newPeer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        // koi aur naya host ban gaya — usse connect karo
        const c = newPeer.connect(roomId);
        c.on('open', () => {
          onConnected(c);
          c.send({ type: 'hello', name: myName, muted: !isMicOn, hand: handRaised });
          if (amOriginalHost) c.send({ type: 'request-host', hostKey, name: myName });
        });
        c.on('data', (d) => handleData(d, c));
        c.on('close', () => tryBecomeHost());
        startHostWatch();
      } else {
        console.warn(err);
        startHostWatch();
      }
    });
    newPeer.on('connection', (conn) => setupConn(conn));
    newPeer.on('call', (call) => handleIncomingCall(call));
  }

  // host ko heartbeat bhejna (sirf admin)
  function startHeartbeat() {
    clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(() => {
      if (!isAdmin) return;
      broadcast({ type: 'heartbeat', hostKey, hostName: myName, hostId: peer.id });
    }, 2000);
  }

  // member host ko watch karta hai (host zinda hai ya nahi)
  function startHostWatch() {
    lastHeartbeat = Date.now();
    clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(() => {
      if (isAdmin) return;
      if (Date.now() - lastHeartbeat > 8000) {
        toast('Host disconnect ho gaya — naya host ban raha hai...');
        tryBecomeHost();
      }
    }, 3000);
  }

  // original host wapas aa jaye to host wapas de do
  function giveHostBack(conn) {
    toast('Original host wapas aa gaya — host wapas de rahe hain');
    isAdmin = false;
    isAdminMuted = false;
    clearInterval(heartbeatTimer);
    const myUnique = roomId + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const oldPeer = peer;
    peer = new Peer(myUnique);
    peer.on('open', () => {
      oldPeer.destroy();
      updateRoomStatus();
      renderMembers();
      const c = peer.connect(roomId); // original host se connect
      c.on('open', () => {
        onConnected(c);
        c.send({ type: 'hello', name: myName, muted: !isMicOn, hand: handRaised });
      });
      c.on('data', (d) => handleData(d, c));
      startHostWatch();
    });
    peer.on('connection', (conn) => setupConn(conn));
    peer.on('call', (call) => handleIncomingCall(call));
  }

  function setupConn(conn) {
    conn.on('open', () => onConnected(conn));
    conn.on('data', (d) => handleData(d, conn));
  }

  function onConnected(conn) {
    connections[conn.peer] = conn;
    conn.send({ type: 'hello', name: myName, muted: !isMicOn, hand: handRaised, isAdmin, hostKey: isAdmin ? hostKey : '' });
    if (myStream) {
      const call = peer.call(conn.peer, myStream);
      call.on('stream', (s) => attachAudio(conn.peer, s));
      call.on('close', () => detachAudio(conn.peer));
    }
    renderMembers();
  }

  function handleIncomingCall(call) {
    const isScreen = !!receivingScreen[call.peer];
    if (isScreen) {
      call.answer();
      call.on('stream', (s) => { if (s.getVideoTracks().length > 0) attachScreenTile(call.peer, s); });
    } else {
      call.answer(myStream || undefined);
      call.on('stream', (s) => {
        if (s.getVideoTracks().length > 0) attachScreenTile(call.peer, s);
        else attachAudio(call.peer, s);
      });
    }
    call.on('close', () => { detachAudio(call.peer); detachScreenTile(call.peer); });
  }

  function handleData(d, conn) {
    const id = conn.peer;
    if (d.type === 'hello') {
      memberMeta[id] = { name: d.name, muted: d.muted, hand: d.hand, adminMuted: false };
      if (d.isAdmin && d.hostKey) originalHostName = d.name;
      addChat('', `${d.name} joined`, true);
      renderMembers();
    } else if (d.type === 'state') {
      if (!memberMeta[id]) memberMeta[id] = { name: 'Member', muted: false, hand: false, adminMuted: false };
      memberMeta[id].muted = d.muted;
      memberMeta[id].hand = d.hand;
      renderMembers();
    } else if (d.type === 'admin-mute') {
      if (d.muted) {
        isAdminMuted = true;
        if (isMicOn) toggleMic();
        toast('👑 Admin ne aapka mic mute kar diya');
      } else {
        isAdminMuted = false;
        toast('👑 Admin ne mic un-mute kar diya');
      }
    } else if (d.type === 'heartbeat') {
      lastHeartbeat = Date.now();
      if (isAdmin && d.hostKey && d.hostKey === hostKey && !amOriginalHost) {
        // original host wapas aa gaya hai — host wapas do
        const c = connections[id];
        if (c) giveHostBack(c);
      }
    } else if (d.type === 'request-host') {
      if (isAdmin && d.hostKey && d.hostKey === hostKey && d.name === originalHostName) {
        giveHostBack(conn);
      }
    } else if (d.type === 'chat') {
      const meta = memberMeta[id] || { name: 'Member' };
      addChat(meta.name, d.text);
    } else if (d.type === 'notes') {
      $('notes').value = d.text;
    }
  }

  function broadcast(data) {
    Object.values(connections).forEach(c => {
      try { c.send(data); } catch (e) {}
    });
  }

  // ---- audio/video ----
  function attachAudio(id, stream) {
    let el = audioEls[id];
    if (!el) {
      el = document.createElement('audio');
      el.autoplay = true;
      audioEls[id] = el;
      document.body.appendChild(el);
    }
    el.srcObject = stream;
  }
  function detachAudio(id) {
    const el = audioEls[id];
    if (el) { el.srcObject = null; el.remove(); }
    delete audioEls[id];
    renderMembers();
  }

  function attachScreenTile(id, stream) {
    const area = $('screenArea');
    area.classList.add('active');
    const tile = document.createElement('div');
    tile.className = 'screen-tile';
    tile.id = 'screen-' + id;
    const video = document.createElement('video');
    video.autoplay = true;
    video.playsInline = true;
    video.srcObject = stream;
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = '🖥 ' + (memberMeta[id] ? memberMeta[id].name : 'Screen');
    tile.appendChild(video);
    tile.appendChild(label);
    $('screenTiles').appendChild(tile);
  }
  function detachScreenTile(id) {
    const el = document.getElementById('screen-' + id);
    if (el) el.remove();
    if ($('screenTiles').children.length === 0) $('screenArea').classList.remove('active');
  }

  // ---- UI ----
  function updateRoomStatus() {
    $('roomStatus').innerHTML = `Room: <b>${roomId}</b> — as <b>${myName}</b> ${isAdmin ? '👑 Admin' : ''}`;
  }

  function renderMembers() {
    const box = $('members');
    box.innerHTML = '';
    let count = 1;
    const me = document.createElement('div');
    me.className = 'member' + (!isMicOn ? ' muted' : '') + (handRaised ? ' raised' : '') + (isAdmin ? ' admin' : '');
    me.innerHTML = `<span class="dot"></span><span>${escapeHtml(myName)} ${isAdmin ? '👑' : ''} (You)</span>` +
      (!isMicOn ? '<span class="muted-icon">🔇</span>' : '') +
      (handRaised ? '<span class="hand-icon">🙋</span>' : '');
    box.appendChild(me);
    Object.keys(memberMeta).forEach(id => {
      const m = memberMeta[id];
      count++;
      const el = document.createElement('div');
      el.className = 'member' + (m.muted ? ' muted' : '') + (m.hand ? ' raised' : '');
      const muteBtn = isAdmin
        ? `<button class="admin-mute" onclick="adminToggleMic('${id}')">${m.adminMuted ? '🔊' : '🔇'}</button>`
        : '';
      el.innerHTML = `<span class="dot"></span><span>${escapeHtml(m.name)}</span>` +
        (m.muted ? '<span class="muted-icon">🔇</span>' : '') +
        (m.hand ? '<span class="hand-icon">🙋</span>' : '') +
        muteBtn;
      box.appendChild(el);
    });
    $('memberCount').textContent = count;
  }

  function adminToggleMic(peerId) {
    if (!isAdmin) return;
    const m = memberMeta[peerId];
    if (!m) return;
    const newMuted = !m.adminMuted;
    m.adminMuted = newMuted;
    m.muted = newMuted;
    const conn = connections[peerId];
    if (conn) {
      try { conn.send({ type: 'admin-mute', muted: newMuted }); } catch(e) {}
    }
    renderMembers();
    toast(newMuted ? 'Member ka mic mute kar diya' : 'Member ka mic on kar diya');
  }

  // ---- Controls ----
  function toggleMic() {
    if (!myAudioTrack) { toast('Mic available nahi'); return; }
    if (isAdminMuted) { toast('👑 Admin ne mic mute kiya hai — aap khud on nahi kar sakte'); return; }
    isMicOn = !isMicOn;
    myAudioTrack.enabled = isMicOn;
    $('btnMic').textContent = isMicOn ? '🎤 Mic: ON' : '🔇 Mic: OFF';
    $('btnMic').className = isMicOn ? '' : 'off';
    broadcast({ type: 'state', muted: !isMicOn, hand: handRaised });
    renderMembers();
  }

  function toggleHand() {
    handRaised = !handRaised;
    $('btnHand').textContent = handRaised ? '🙋 Hand: RAISED' : '🙋 Raise Hand';
    broadcast({ type: 'state', muted: !isMicOn, hand: handRaised });
    renderMembers();
    toast(handRaised ? 'Hand raised!' : 'Hand lowered');
  }

  async function toggleScreen() {
    if (isScreenOn) { stopScreen(); return; }
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      isScreenOn = true;
      $('btnScreen').textContent = '🖥 Stop Share';
      $('btnScreen').className = 'off';
      toast('Screen sharing ON');

      const area = $('screenArea');
      area.classList.add('active');
      const tile = document.createElement('div');
      tile.className = 'screen-tile';
      tile.id = 'screen-mine';
      const video = document.createElement('video');
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.srcObject = screenStream;
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = '🖥 ' + myName + ' (You)';
      tile.appendChild(video);
      tile.appendChild(label);
      $('screenTiles').appendChild(tile);

      Object.keys(connections).forEach((pid) => {
        const call = peer.call(pid, screenStream);
        screenCalls[pid] = call;
        call.on('close', () => { delete screenCalls[pid]; });
      });

      screenStream.getVideoTracks()[0].onended = () => stopScreen();
    } catch (e) {
      toast('Screen share cancel ho gaya');
    }
  }

  function stopScreen() {
    if (!isScreenOn) return;
    Object.values(screenCalls).forEach(c => { try { c.close(); } catch(e) {} });
    screenCalls = {};
    if (screenStream) {
      screenStream.getTracks().forEach(t => t.stop());
      screenStream = null;
    }
    isScreenOn = false;
    $('btnScreen').textContent = '🖥 Screen Share';
    $('btnScreen').className = '';
    detachScreenTile('mine');
    toast('Screen sharing OFF');
  }

  function copyLink() {
    const url = buildUrl();
    navigator.clipboard.writeText(url + '\nLeopards MUX Zone Room — open karein aur apna naam likh kar join karein')
      .then(() => toast('Room link copied!'))
      .catch(() => toast(url));
  }

  // auto-join from URL hash
  window.addEventListener('load', () => {
    const hash = location.hash;
    const params = new URLSearchParams(hash.replace(/^#/, ''));
    const room = params.get('room') || '';
    hostKey = params.get('host') || '';
    if (room) {
      $('joinRoom').value = room;
      $('joinRoom').style.display = 'none';
      $('schedDate').parentElement.style.display = 'none';
      $('joinName').placeholder = 'Sirf apna name likhein...';
      $('joinName').focus();
      $('joinName').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') startMeeting();
      });
      // original host tabhi hai jab is browser ne room banaya tha
      const stored = localStorage.getItem('lmz-owner-' + room);
      if (hostKey && stored === hostKey) amOriginalHost = true;
    } else {
      $('joinRoom').value = 'leopards-zone';
      hostKey = genKey();
      amOriginalHost = true;
    }
  });

  // ---- Notes ----
  let notesTimer = null;
  $('notes').addEventListener('input', (e) => {
    clearTimeout(notesTimer);
    notesTimer = setTimeout(() => {
      broadcast({ type: 'notes', text: e.target.value });
      autosaveNotes();
    }, 600);
  });

  function autosaveNotes() {
    if (!roomId) return;
    try {
      localStorage.setItem('lmz-notes-' + roomId, $('notes').value);
      const saved = $('notesSaved');
      saved.textContent = '💾 saved';
      setTimeout(() => { saved.textContent = ''; }, 1500);
    } catch(e) {}
  }

  function loadNotes() {
    if (!roomId) return;
    try {
      const saved = localStorage.getItem('lmz-notes-' + roomId);
      if (saved && !$('notes').value) $('notes').value = saved;
    } catch(e) {}
  }

  function generateSummary() {
    const text = $('notes').value.trim();
    if (!text) { toast('Pehle notes likhein'); return; }

    const lines = text.split(/\n+/).map(l => l.trim()).filter(l => l.length > 2);
    const words = text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length > 3);
    const stopWords = ['the','and','that','this','with','from','have','will','into','about','your','our','their','then','them','for','are','was','were','been','not','but','what','when','which','they','you','sir','karo','kya','hai','hain','aur','lekin','tum','aap','mein','ka','ki','ke','se','ko','par','ho','hoga','tha','the','bhi','nahi','yah'];
    const freq = {};
    words.forEach(w => { if (!stopWords.includes(w)) freq[w] = (freq[w] || 0) + 1; });
    const topWords = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0,10);

    // bullet points: har line ka pehla 12 words
    const bullets = lines.slice(0, 12).map(l => {
      const parts = l.split(/[:\-–]/);
      return '• ' + (parts[0].length > 90 ? parts[0].slice(0, 90) + '...' : parts[0]);
    });

    const date = new Date().toLocaleString();
    let summary = '';
    summary += '📋 Meeting Summary — ' + date + '\n';
    summary += '─────────────────\n';
    summary += '📌 Main Points:\n' + bullets.join('\n') + '\n\n';
    if (topWords.length) summary += '🔑 Key Topics: ' + topWords.map(([w,n]) => w + (n>1 ? '(' + n + ')' : '')).join(', ') + '\n';
    summary += '\n✅ Total notes lines: ' + lines.length;

    $('summaryText').textContent = summary;
    $('summaryBox').style.display = 'block';
    toast('Summary ready!');
  }

  function exportNotes() {
    const text = $('notes').value.trim();
    if (!text) { toast('Kuch nahi hai export karne ke liye'); return; }
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'leopards-notes-' + roomId + '.txt';
    a.click();
    URL.revokeObjectURL(url);
    toast('Notes downloaded!');
  }

  // ---- Chat ----
  function sendChat() {
    const msg = $('chatMsg').value.trim();
    if (!msg) return;
    broadcast({ type: 'chat', text: msg });
    addChat(myName, msg);
    $('chatMsg').value = '';
  }
</script>
</body>
</html>
